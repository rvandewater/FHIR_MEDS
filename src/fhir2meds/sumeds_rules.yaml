# suMEDS enrichment rules for fhir2meds code metadata (format `sumeds-rules/0.1`, read by
# suMEDS >= 0.6; https://github.com/rvandewater/SumMEDS). Registered as `FHIR` in suMEDS's
# `sumeds.rules` entry-point group, so `--rules FHIR` finds this file.
#
# fhir2meds writes codes as `<ResourceType>//<VOCAB>//<code>` (and `<ResourceType>_END//...` for end
# events), with the FHIR `display` as description but no parents. The resource type comes first,
# so suMEDS's built-in `VOCABULARY//CODE` layouts never see the vocabulary; these rules point it
# at the vocabulary code instead. suMEDS then validates that code, adds the official title where
# the code has none, and the vocabulary code and its ancestors as `parent_codes`.
#
# - LOINC and the ICD vocabularies are validated against suMEDS's versioned ontology packs (no
#   Athena needed). Undotted ICD codes (MIMIC's) are dotted first, as the packs spell them.
# - SNOMED, RxNorm, CVX, NDC, CPT-4 and HCPCS have no public pack: they are looked up only in
#   an OHDSI Athena download (`--athena-csv DIR`), and skipped without one.
#
# `<VOCAB>` is the short name `vocabulary.py` gives the FHIR code system. Every pattern matches a
# whole code; tests/test_sumeds_rules.py checks them against the codes the converter writes.
schema: sumeds-rules/0.1

ontology:
  # Standard code system URIs (Synthea, most FHIR servers).
  - id: fhir-loinc
    pattern: "^[A-Za-z]+(?:_END)?//LOINC//(?P<code>[0-9]{1,7}-[0-9])$"
    vocabulary: LOINC
  - id: fhir-icd10cm
    pattern: '^[A-Za-z]+(?:_END)?//ICD10CM//(?P<code>[A-Z][0-9][0-9A-Z](?:\.?[0-9A-Z]{1,4})?)$'
    vocabulary: ICD10CM
    normalize: &dot_icd10cm
      - pattern: "^([A-Z][0-9][0-9A-Z])([0-9A-Z]+)$"
        replace: '\1.\2'
  - id: fhir-icd9cm
    pattern: '^[A-Za-z]+(?:_END)?//ICD9CM//(?P<code>(?:[0-9]{3}|V[0-9]{2})(?:\.?[0-9]{1,2})?|E[0-9]{3}(?:\.?[0-9])?)$'
    vocabulary: ICD9CM
    normalize: &dot_icd9cm
      - pattern: "^([0-9]{3}|V[0-9]{2}|E[0-9]{3})([0-9]+)$"
        replace: '\1.\2'
  - id: fhir-icd10pcs
    pattern: "^[A-Za-z]+(?:_END)?//ICD10PCS//(?P<code>[0-9A-HJ-NP-Z]{7})$"
    vocabulary: ICD10PCS

  # MIMIC-IV FHIR's own ICD code systems (`.../diagnosis-icd10`, `.../mimic-procedure-icd9`, ...)
  # become `ICD10` and `ICD9`: diagnoses are ICD-10-CM / ICD-9-CM, procedures ICD-10-PCS /
  # ICD-9 procedure codes. WHO ICD-10 (`http://hl7.org/fhir/sid/icd-10`) is also called `ICD10`;
  # its codes are checked against ICD-10-CM too, which shares most of them.
  - id: fhir-condition-icd10
    pattern: '^Condition(?:_END)?//ICD10//(?P<code>[A-Z][0-9][0-9A-Z](?:\.?[0-9A-Z]{1,4})?)$'
    vocabulary: ICD10CM
    normalize: *dot_icd10cm
  - id: fhir-condition-icd9
    pattern: '^Condition(?:_END)?//ICD9//(?P<code>(?:[0-9]{3}|V[0-9]{2})(?:\.?[0-9]{1,2})?|E[0-9]{3}(?:\.?[0-9])?)$'
    vocabulary: ICD9CM
    normalize: *dot_icd9cm
  - id: fhir-procedure-icd10
    pattern: "^Procedure(?:_END)?//ICD10//(?P<code>[0-9A-HJ-NP-Z]{7})$"
    vocabulary: ICD10PCS
  - id: fhir-procedure-icd9
    pattern: '^Procedure(?:_END)?//ICD9//(?P<code>[0-9]{2}(?:\.?[0-9]{1,2})?)$'
    vocabulary: ICD9Proc
    normalize:
      - pattern: "^([0-9]{2})([0-9]+)$"
        replace: '\1.\2'

  # No public pack: validated against an Athena download only (OMOP vocabulary ids).
  - id: fhir-snomed
    pattern: "^[A-Za-z]+(?:_END)?//SNOMED//(?P<code>[0-9]{6,18})$"
    vocabulary: SNOMED
    validate: athena
  - id: fhir-rxnorm
    pattern: "^[A-Za-z]+(?:_END)?//RXNORM//(?P<code>[0-9]+)$"
    vocabulary: RxNorm
    validate: athena
  - id: fhir-cvx
    pattern: "^[A-Za-z]+(?:_END)?//CVX//(?P<code>[0-9]{1,3})$"
    vocabulary: CVX
    validate: athena
  # `[MIMIC-]MEDICATION-NDC` is MIMIC's NDC code system.
  - id: fhir-ndc
    pattern: "^[A-Za-z]+(?:_END)?//(?:(?:MIMIC-)?MEDICATION-)?NDC//(?P<code>[0-9]{11})$"
    vocabulary: NDC
    validate: athena
  # `[MIMIC-]HCPCS-CD` is MIMIC's HCPCS code system: CPT-4 codes (four digits and a digit or letter) and
  # HCPCS Level II codes (a letter and four digits).
  - id: fhir-cpt4
    pattern: "^[A-Za-z]+(?:_END)?//(?:CPT|(?:MIMIC-)?HCPCS-CD)//(?P<code>[0-9]{4}[0-9A-Z])$"
    vocabulary: CPT4
    validate: athena
  - id: fhir-hcpcs
    pattern: "^[A-Za-z]+(?:_END)?//(?:MIMIC-)?HCPCS-CD//(?P<code>[A-V][0-9]{4})$"
    vocabulary: HCPCS
    validate: athena
