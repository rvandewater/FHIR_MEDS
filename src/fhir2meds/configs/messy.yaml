# The FHIR ETL as one MEDS-Extract spec (MESSY), registered as `FHIR`:
#
#   meds-extract-run spec=FHIR output_dir=OUT do_download=false input_dir=FHIR_DIR
#
# The pre-stage `fhir_pre_meds` (src/fhir2meds/stages.py) flattens the FHIR resources (NDJSON / Bundles, optionally
# gzipped) into one table per resource type, <OUT>/fhir_pre_meds/<ResourceType>.parquet, which the top-level keys
# below name. It writes every table listed here, without rows when the input has none of that resource type.
# The post-stage `sumeds_enrich` adds vocabulary titles and parents to metadata/codes.parquet with the rules
# registered as `FHIR` (src/fhir2meds/sumeds_rules.yaml), and records that in metadata/dataset.json.
#
# Values are dftly expressions: `$col` is a column, f"..." interpolates, `??` coalesces. All times were already
# parsed to naive (UTC by default) datetimes by pre-MEDS, so no format casts are needed. Rows whose code or time
# resolve to null are dropped by MEDS-Extract, which logs a per-event count.
#
# Codes follow `<ResourceType>//<VOCAB>//<code>`, e.g. `Observation//LOINC//8867-4`, `Condition//ICD10CM//N179`.

etl:
  # This spec converts any FHIR export, so it sets no license or description URI. Name a build with
  # "overrides=['etl_metadata.dataset_name=MY_DATASET']" and dataset_version=MY_VERSION.
  dataset_name: FHIR
  # The unit of an Observation value modifies its code.
  code_modifier_columns: [unit]
  pre_stages:
    - fhir_pre_meds
  post_stages:
    - sumeds_enrich:
        rules: FHIR

# Where raw FHIR data can be downloaded from (`meds-extract-run spec=FHIR ... dataset_key=<bucket>`):
# `demo` is the open-access MIMIC-IV FHIR demo, `mimic` the credentialed MIMIC-IV FHIR release (it needs
# PHYSIONET_USER / PHYSIONET_PASSWORD in the environment). There is no `dataset` bucket: point input_dir at your own
# FHIR export (version `unknown` unless dataset_version= is given).
sources:
  dataset_version:
    dataset: unknown
    demo: "2.1.0"
    mimic: "2.1"
  demo:
    - type: physionet
      base_url: https://physionet.org/files/mimic-iv-fhir-demo/${sources.dataset_version.demo}
      include: ["fhir/*.ndjson.gz"]
  mimic:
    - type: physionet
      base_url: https://physionet.org/files/mimic-iv-fhir/${sources.dataset_version.mimic}
      username: ${oc.env:PHYSIONET_USER,null}
      password: ${oc.env:PHYSIONET_PASSWORD,null}
      include: ["fhir/*.ndjson.gz"]

_defaults:
  subject_id: $subject_id

Patient:
  birth:
    code: MEDS_BIRTH
    time: $birth_date
  death:
    code: MEDS_DEATH
    time: $deceased_datetime
  gender:
    code: 'f"GENDER//{$gender}"'
    time: null
  race:
    code: 'f"RACE//{$race}"'
    time: null
  ethnicity:
    code: 'f"ETHNICITY//{$ethnicity}"'
    time: null

Encounter:
  start: &coded_event
    code: 'f"{$resource_type}//{$code_vocab}//{$code}"'
    time: $start
    numeric_value: $value_num
    text_value: $value_text
    unit: $value_unit
    _metadata:
      _self:
        description: $code_display
  end:
    code: 'f"{$resource_type}_END//{$code_vocab}//{$code}"'
    time: $end
    _metadata:
      _self:
        description: $code_display

Condition:
  condition: *coded_event
Observation:
  observation: *coded_event
DiagnosticReport:
  diagnostic_report: *coded_event
Procedure:
  procedure: *coded_event
ServiceRequest:
  service_request: *coded_event
MedicationRequest:
  medication_request: *coded_event
MedicationAdministration:
  medication_administration: *coded_event
MedicationDispense:
  medication_dispense: *coded_event
MedicationStatement:
  medication_statement: *coded_event
Immunization:
  immunization: *coded_event
AllergyIntolerance:
  allergy_intolerance: *coded_event
Specimen:
  specimen: *coded_event
CarePlan:
  care_plan: *coded_event
ImagingStudy:
  imaging_study: *coded_event
DocumentReference:
  document_reference: *coded_event
