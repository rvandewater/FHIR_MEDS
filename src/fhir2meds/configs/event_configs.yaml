  # Custom clinical resource configs. Keys not set here are taken from `default`.
  # Each `time` list is tried in order; the first path that resolves wins.
  MedicationRequest: &medication_request
    code: &medication_code
      - const(resourceType)
      - const(//)
      - vocab(medicationCodeableConcept.coding[0].system)
      - const(//)
      - col(medicationCodeableConcept.coding[0].code)
    description: &medication_description col(medicationCodeableConcept.coding[0].display)
    time: col(authoredOn)
  MedicationAdministration:
    code: *medication_code
    description: *medication_description
    time:
      - col(effectiveDateTime)
      - col(effectivePeriod.start)
  MedicationDispense:
    code: *medication_code
    description: *medication_description
    time:
      - col(whenHandedOver)
      - col(whenPrepared)
  MedicationStatement:
    code: *medication_code
    description: *medication_description
    time:
      - col(effectiveDateTime)
      - col(effectivePeriod.start)
      - col(dateAsserted)
  Immunization:
    code:
      - const(resourceType)
      - const(//)
      - vocab(vaccineCode.coding[0].system)
      - const(//)
      - col(vaccineCode.coding[0].code)
    description: col(vaccineCode.coding[0].display)
    time:
      - col(occurrenceDateTime)
      - col(recorded)
  Specimen:
    code:
      - const(resourceType)
      - const(//)
      - vocab(type.coding[0].system)
      - const(//)
      - col(type.coding[0].code)
    description: col(type.coding[0].display)
    time:
      - col(collection.collectedDateTime)
      - col(collection.collectedPeriod.start)
      - col(receivedTime)
  Encounter:
    code:
      - const(resourceType)
      - const(//)
      - vocab(type[0].coding[0].system)
      - const(//)
      - col(type[0].coding[0].code)
    description: col(type[0].coding[0].display)
    time:
      - col(period.start)
  default:
    code:
      - const(resourceType)
      - const(//)
      - vocab(code.coding[0].system)
      - const(//)
      - col(code.coding[0].code)
    description: col(code.coding[0].display)
    time:
      - col(effectiveDateTime)
      - col(effectivePeriod.start)
      - col(effectiveInstant)
      - col(issued)
      - col(authoredOn)
      - col(performedDateTime)
      - col(performedPeriod.start)
      - col(onsetDateTime)
      - col(onsetPeriod.start)
      - col(recordedDate)
      - col(occurrenceDateTime)
      - col(occurrencePeriod.start)
    numeric_value: col(valueQuantity.value)
    text_value:
      - col(valueString)
      - col(valueCodeableConcept.text)
      - col(valueCodeableConcept.coding[0].display)
      - col(valueCodeableConcept.coding[0].code)
      - col(valueDateTime)
  Patient:
    code:
      - const(MEDS_BIRTH)
    time: col(birthDate)
