[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fhir2meds"
dynamic = ["version"]
description = "Convert HL7 FHIR (R4/R5) resources to the MEDS format with MEDS-Extract."
authors = [ { name = "Robin P. van de Water", email = "robin.vandewater@hpi.de" } ]
readme = "README.md"
requires-python = ">=3.11.4,<3.14"
dependencies = [
    "MEDS-extract[download]~=0.7.1",
    "meds~=0.4.0",
    "polars>=1.38,<2",
    "pyarrow",
    "pyyaml>=6.0",
    "hydra-core",
    "omegaconf",
]

[project.optional-dependencies]
validation = ["fhir.resources>=7.1"]
tests = ["pytest", "pytest-cov", "fhir.resources>=7.1"]
dev = ["pre-commit<4"]
local_parallelism = ["hydra-joblib-launcher"]

[tool.setuptools_scm]

[project.scripts]
fhir2meds = "fhir2meds.__main__:main"
FHIR_MEDS = "fhir2meds.__main__:main"
MEDS_ON_FHIR = "fhir2meds.__main__:main"

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["src", "tests"]
