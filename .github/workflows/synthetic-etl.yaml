name: Synthetic ETL for MESSY files using MESSY_synth

# Generates raw tables straight from the shipped MESSY config with MESSY-synth and runs the ETL over
# them. MESSY-synth validates that every event block yields events and fails the job otherwise, so
# this catches expressions that only work on the dtypes of one particular export. It complements
# the FHIR fixtures in tests/, which check specific values.
#
# MESSY-synth writes the tables the MESSY config reads (<ResourceType>.parquet), not raw FHIR. Those
# are the tables the `fhir_pre_meds` pre-stage would write from FHIR NDJSON / Bundles (run on these
# tables it finds no FHIR resources and fails), so the ETL runs with
# `skip_stages=[fhir_pre_meds]`: MEDS-Extract then reads the synthetic tables from input_dir
# directly. All canonical MEDS-Extract stages and the `sumeds_enrich` post-stage run. FHIR parsing
# itself is covered by the tests in tests/.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev", "feat/*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        # MESSY-synth requires Python >= 3.12.
        python-version: ["3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --locked
          # MESSY_synth 0.1.0 is the first release that reads MEDS-Extract 0.8 configs.
          uv pip install "MESSY_synth==0.1.0"

      - name: Generate and extract synthetic data
        run: |
          uv run --no-sync MESSY-synth ./src/fhir2meds/configs/messy.yaml -o raw_synthetic/ --explain
          uv run --no-sync meds-extract-run spec=FHIR output_dir=./FHIR_meds_synth \
            input_dir=raw_synthetic do_download=false 'skip_stages=[fhir_pre_meds]'
          for f in dataset.json codes.parquet subject_splits.parquet; do
            test -f "FHIR_meds_synth/metadata/$f"
          done
